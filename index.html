    <script>
      // Suppress Vite HMR WebSocket closing errors in sandbox/iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event.reason && (event.reason.message || event.reason.stack || '')) || '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('vite')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event.message || '') + ' ' + (event.filename || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
