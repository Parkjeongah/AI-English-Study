<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer thought pulse ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="12 12" />

  <!-- Main Speech / Thought Bubble -->
  <path d="M140 180 C140 125 192 80 256 80 C320 80 372 125 372 180 C372 235 320 280 256 280 C234 280 213 275 195 266 L150 285 L162 245 C148 226 140 204 140 180 Z"
        fill="url(#bubbleGrad)" filter="url(#shadow)" />

  <!-- Central Sparkle / Brain neural icon in Indigo -->
  <path d="M256 125 L266 160 L301 170 L266 180 L256 215 L246 180 L211 170 L246 160 Z" fill="#4F46E5" />

  <!-- Secondary sparkle accents -->
  <path d="M315 125 L320 140 L335 145 L320 150 L315 165 L310 150 L295 145 L310 140 Z" fill="#818CF8" />
  <circle cx="195" cy="140" r="6" fill="#818CF8" />
  <circle cx="325" cy="205" r="5" fill="#818CF8" />

  <!-- Soundwave / Speech ripple bars below -->
  <g fill="#FFFFFF" opacity="0.9">
    <rect x="186" y="340" width="16" height="48" rx="8" />
    <rect x="221" y="320" width="16" height="88" rx="8" />
    <rect x="256" y="305" width="16" height="118" rx="8" />
    <rect x="291" y="320" width="16" height="88" rx="8" />
    <rect x="326" y="340" width="16" height="48" rx="8" />
  </g>
</svg>
